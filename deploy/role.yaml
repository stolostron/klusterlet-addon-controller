apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  creationTimestamp: null
  name: open-cluster-management:klusterlet-addon-controller
  namespace: open-cluster-management
rules:
- apiGroups:
    - ""
  resources:
    - events
    - secrets
    - configmaps
    - serviceaccounts
    - services
  verbs:
    - create
    - delete
    - get
    - list
    - patch
    - update
    - watch
- apiGroups:
    - agent.open-cluster-management.io
  resources:
    - klusterletaddonconfigs
    - klusterletaddonconfigs/finalizers
    - klusterletaddonconfigs/status
  verbs:
    - create
    - delete
    - get
    - list
    - patch
    - update
    - watch
- apiGroups:
    - cluster.open-cluster-management.io
  resources:
    - managedclusters
    - managedclusters/finalizers
  verbs:
    - create
    - get
    - list
    - patch
    - update
    - watch
- apiGroups:
    - work.open-cluster-management.io
  resources:
    - manifestworks
    - manifestworks/finalizers
  verbs:
    - create
    - delete
    - get
    - list
    - patch
    - update
    - watch
- apiGroups:
    - rbac.authorization.k8s.io
  resources:
    - roles
    - rolebindings
  verbs:
    - create
    - delete
    - get
    - list
    - patch
    - update
    - watch

# appmgr
- apiGroups:
    - apps.open-cluster-management.io
  resources:
    - subscriptions
  verbs:
    - get
    - list
    - watch
- apiGroups:
    - coordination.k8s.io
  resources:
    - leases
  verbs:
    - create
    - get
    - list
    - patch
    - update
    - watch
    - delete
- apiGroups:
    - addon.open-cluster-management.io
  resources:
    - managedclusteraddons
    - managedclusteraddons/status
    - clustermanagementaddons
  verbs:
    - create
    - delete
    - get
    - list
    - patch
    - update
    - watch
- apiGroups:
    - imageregistry.open-cluster-management.io
  resources:
    - managedclusterimageregistries
    - managedclusterimageregistries/status
  verbs:
    - get
    - list
    - watch
- apiGroups:
    - operator.open-cluster-management.io
  resources:
    - multiclusterhubs
  verbs:
    - get
    - list
# Needed by pkg/controller/addon/collectorconfig.go: resolves the hub Search CR's
# namespace and reads merged-collector-config's .spec to distribute it to the search-collector
# ManagedClusterAddOn's values annotation. watch is only needed on collectorconfigs, for the
# CollectorConfig informer registered in pkg/controller/addon/add_manager.go. The search
# component may not be installed on every hub -- that watch setup is defensive (logs and
# continues on failure) and the Search/CollectorConfig reads treat "no matching kind" the same
# as "not found", but this ClusterRole must still grant access for hubs where search IS
# installed, or every such read fails with Forbidden instead of gracefully finding no data.
- apiGroups:
    - search.open-cluster-management.io
  resources:
    - searches
  verbs:
    - get
    - list
- apiGroups:
    - search.open-cluster-management.io
  resources:
    - collectorconfigs
  verbs:
    - get
    - list
    - watch
